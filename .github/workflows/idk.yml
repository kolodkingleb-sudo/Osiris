name: Build Osiris.dll

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:  # ручной запуск

jobs:
  build:
    runs-on: windows-2022   # можно windows-2025, но 2022 стабильнее

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution (Release x64)
        run: |
          msbuild Osiris.sln /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /m

      - name: Upload DLL as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Osiris-x64-Release
          path: |
            x64/Release/Osiris.dll
            Release/Osiris.dll
          if-no-files-found: error
