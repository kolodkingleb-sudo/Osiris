name: Windows

on:
  push:
  pull_request:

jobs:
  msbuild:
    name: MSBuild (${{ matrix.os }} / ${{ matrix.toolset }} / ${{ matrix.configuration }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        toolset: [ClangCL, MSVC]
        configuration: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Set ClangCL toolset
        if: matrix.toolset == 'ClangCL'
        shell: pwsh
        run: |
          "MSBUILD_TOOLSET=/p:PlatformToolset=ClangCL" >> $env:GITHUB_ENV

      - name: Build solution
        shell: cmd
        run: |
          msbuild Osiris.sln ^
            /m ^
            /p:Platform=x64 ^
            /p:Configuration=${{ matrix.configuration }} ^
            ${{ env.MSBUILD_TOOLSET }}

      - name: Upload MSBuild artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: osiris-msbuild-${{ matrix.os }}-${{ matrix.toolset }}-${{ matrix.configuration }}
          path: |
            **/x64/${{ matrix.configuration }}/**/*.exe
            **/x64/${{ matrix.configuration }}/**/*.dll
            **/x64/${{ matrix.configuration }}/**/*.pdb
            **/bin/x64/${{ matrix.configuration }}/**/*.exe
            **/bin/x64/${{ matrix.configuration }}/**/*.dll
            **/bin/x64/${{ matrix.configuration }}/**/*.pdb
          if-no-files-found: warn
          retention-days: 14

  cmake:
    name: CMake (${{ matrix.os }} / ${{ matrix.toolset }} / ${{ matrix.configuration }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        toolset: [ClangCL, MSVC]
        configuration: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure CMake
        shell: pwsh
        run: |
          if ("${{ matrix.toolset }}" -eq "ClangCL") {
            cmake `
              -Werror=dev `
              -D ENABLE_TESTS="unit;functional" `
              -D CMAKE_COMPILE_WARNING_AS_ERROR=1 `
              -A x64 `
              -T ClangCL `
              -B build
          }
          else {
            cmake `
              -Werror=dev `
              -D ENABLE_TESTS="unit;functional" `
              -D CMAKE_COMPILE_WARNING_AS_ERROR=1 `
              -A x64 `
              -B build
          }

      - name: Build source
        run: cmake --build build --target Osiris --config ${{ matrix.configuration }} --parallel

      - name: Build unit tests
        run: cmake --build build --target UnitTests --config ${{ matrix.configuration }} --parallel

      - name: Build functional tests
        run: cmake --build build --target FunctionalTests --config ${{ matrix.configuration }} --parallel

      - name: Run unit tests
        run: >
          ctest -R ^Unit
          --test-dir build
          -C ${{ matrix.configuration }}
          --output-on-failure
          --no-tests=error
          --schedule-random
          -j $env:NUMBER_OF_PROCESSORS

      - name: Run functional tests
        run: >
          ctest -R ^Functional
          --test-dir build
          -C ${{ matrix.configuration }}
          --output-on-failure
          --no-tests=error
          --schedule-random
          -j $env:NUMBER_OF_PROCESSORS

      - name: Upload CMake artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: osiris-cmake-${{ matrix.os }}-${{ matrix.toolset }}-${{ matrix.configuration }}
          path: |
            build/**/*.exe
            build/**/*.dll
            build/**/*.pdb
          if-no-files-found: warn
          retention-days: 14
